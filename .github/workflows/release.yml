# OfficeLinks — construction de l'archive du plugin et publication.
#
# - Pull request / lancement manuel : construit l'archive et la joint au run
#   (onglet « Artifacts ») pour vérification.
# - Tag vX.Y.Z : vérifie que le tag correspond à PLUGIN_OFFICELINKS_VERSION
#   (setup.php), lance les tests, construit l'archive puis publie la release
#   GitHub (notes reprises de la section correspondante de CHANGELOG.md).
#
# Deux jobs :
# - « build » : lecture seule. Il exécute le code de la branche (tests,
#   construction) et n'a jamais de droit d'écriture.
# - « publish » : uniquement sur un tag. Il n'exécute aucun code du dépôt :
#   il récupère l'archive produite par « build », vérifie son sha256 et
#   crée la release (seul job avec contents: write).
#
# L'archive ne contient QUE les fichiers nécessaires à GLPI (liste blanche
# ci-dessous) : ni vendor/, ni tests, ni outils, ni CLAUDE.md, ni fichiers
# de développement. Elle s'extrait en un dossier « officelinks/ », à placer
# dans le dossier plugins/ de GLPI.
#
# Les actions sont épinglées par SHA de commit (version en commentaire) ;
# Dependabot (.github/dependabot.yml) propose les mises à jour.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un seul run par ref ; un run de publication n'est jamais annulé.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Archive du plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      archive: ${{ steps.build.outputs.archive }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Installation de PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      # Aucun cache : setup-node v4 ne met en cache que si « cache: » est
      # renseigné, et le dépôt n'a pas de package.json.
      - name: Installation de Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: '22'

      - name: Version du plugin
        id: version
        run: |
          version=$(sed -n "s/^define('PLUGIN_OFFICELINKS_VERSION', '\([^']*\)');.*/\1/p" setup.php)
          # Format strict : la valeur est ensuite utilisée dans des noms de
          # fichiers et des commandes.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error file=setup.php::PLUGIN_OFFICELINKS_VERSION absente ou invalide"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version : $version"

      - name: Concordance tag / version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error file=setup.php::Le tag ${GITHUB_REF_NAME} ne correspond pas à PLUGIN_OFFICELINKS_VERSION (${VERSION})"
            exit 1
          fi

      - name: Tests avant publication
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          vendor/bin/phpunit
          node --test tests/js/officelinks.test.js

      - name: Construction de l'archive
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          staging="build/officelinks"
          rm -rf build && mkdir -p "$staging"

          # Liste blanche : fichiers et dossiers nécessaires à GLPI.
          for item in setup.php hook.php LICENSE README.md README.fr.md CHANGELOG.md logo.png \
                      front public src templates; do
            if [ -e "$item" ]; then
              cp -R "$item" "$staging/"
            fi
          done
          # Traductions : GLPI ne lit que les .mo.
          mkdir -p "$staging/locales"
          cp locales/*.mo "$staging/locales/"

          # Garde-fou : rien de ce qui suit ne doit se retrouver dans l'archive.
          forbidden=$(find "$staging" \( -name vendor -o -name tests -o -name tools -o -name 'CLAUDE.md' \
                       -o -name 'composer.*' -o -name '.git*' -o -name '.github' -o -name 'phpunit.xml*' \
                       -o -name '.glpi-src' -o -name 'node_modules' \) -print)
          if [ -n "$forbidden" ]; then
            echo "::error::Fichiers interdits dans l'archive : $forbidden"
            exit 1
          fi

          archive="officelinks-${VERSION}.zip"
          (cd build && zip -qr -X "$archive" officelinks)
          (cd build && sha256sum "$archive" > "$archive.sha256")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "Contenu de $archive :"
          (cd build && unzip -l "$archive")

      - name: Notes de version (CHANGELOG.md)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Section « ## [X.Y.Z] » jusqu'à la section suivante.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > build/notes.md
          if [ ! -s build/notes.md ]; then
            echo "Version $VERSION." > build/notes.md
          fi
          cat build/notes.md

      - name: Archive jointe au run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: officelinks-${{ steps.version.outputs.version }}
          path: |
            build/${{ steps.build.outputs.archive }}
            build/${{ steps.build.outputs.archive }}.sha256
            build/notes.md
          if-no-files-found: error

  publish:
    name: Publication de la release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # création de la release

    steps:
      - name: Récupération de l'archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: officelinks-${{ needs.build.outputs.version }}
          path: dist

      - name: Vérification et publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c "${ARCHIVE}.sha256"
          gh release create "${GITHUB_REF_NAME}" \
            "${ARCHIVE}" \
            "${ARCHIVE}.sha256" \
            --title "OfficeLinks ${VERSION}" \
            --notes-file notes.md \
            --verify-tag
