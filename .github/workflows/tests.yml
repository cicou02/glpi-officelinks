# OfficeLinks — tests unitaires.
#
# Lancé sur chaque pull request et à chaque push sur main (sauf si seuls des
# fichiers .github/ changent : main ne contient alors pas encore le code).
# PHP 8.2 (minimum de GLPI 11) à 8.4 ; Node pour les tests du JavaScript.
# Actions épinglées par SHA de commit (version en commentaire), mises à jour
# proposées par Dependabot (.github/dependabot.yml).
name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Récupération du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Installation de PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Installation de Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Cache Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Dépendances de développement
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntaxe PHP (php -l)
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './.glpi-src/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Tests JavaScript
        run: node --test tests/js/officelinks.test.js
